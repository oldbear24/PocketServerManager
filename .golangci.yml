version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
        - G301 # directories of the agent volume are not secrets
        - G304 # paths come from the configuration
        - G306 # ditto for files that hold no secrets
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
